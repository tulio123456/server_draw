<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>AirDraw Photo Server</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#090c12; color:#f5f7fb; }
    main { width:min(520px,calc(100% - 32px)); padding:28px; border:1px solid #252c39; border-radius:22px; background:#111620; }
    h1 { margin:0 0 10px; }
    p { color:#99a3b5; line-height:1.55; }
    a { display:inline-block; margin-top:10px; padding:11px 14px; border-radius:11px; background:#6676e9; color:white; text-decoration:none; font-weight:700; }
    code { color:#bac2ff; }
  </style>
</head>
<body>
  <main>
    <h1>AirDraw Photo Server</h1>
    <p>Servidor Vercel ativo. Teste a API em <code>/api/health</code> ou entre no painel administrativo.</p>
    <a href="/admin">Abrir Admin</a>
  </main>
</body>
</html>
