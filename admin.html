<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>AirDraw • Admin</title>
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
  <main class="shell">
    <section id="loginView" class="login-card">
      <span class="eyebrow">AIRDRAW • SERVER</span>
      <h1>Painel Admin</h1>
      <p>Entre para visualizar as capturas guardadas no Vercel Blob privado.</p>

      <form id="loginForm">
        <input id="password" type="password" autocomplete="current-password" placeholder="Senha do administrador" required />
        <button type="submit">Entrar</button>
      </form>

      <div id="loginMessage" class="error"></div>
    </section>

    <section id="dashboardView" class="hidden">
      <header>
        <div>
          <span class="eyebrow">AIRDRAW • CAPTURAS</span>
          <h1>Galeria</h1>
          <p id="count">Carregando...</p>
        </div>

        <div class="header-actions">
          <button id="refreshBtn">Atualizar</button>
          <button id="logoutBtn">Sair</button>
        </div>
      </header>

      <div id="notice" class="notice hidden"></div>
      <div id="empty" class="empty hidden">Nenhuma captura recebida ainda.</div>
      <div id="gallery" class="gallery"></div>
    </section>
  </main>

  <dialog id="preview">
    <button id="closePreview" class="close" aria-label="Fechar">×</button>
    <img id="previewImage" alt="Captura ampliada" />
  </dialog>

  <script src="/admin.js" type="module"></script>
</body>
</html>
